name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Architecture, naming, and lint guard
        run: bun run check:architecture

      - name: Verify Drizzle migrations are committed
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle

      - name: Verify Worker bundle
        run: bun run deploy:dry-run
